name: Release Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build with the permanent project key
        required: true
        type: string

concurrency:
  group: android-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Require a version tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Restore permanent signing identity (fail closed)
        env:
          MC_ANDROID_KEYSTORE_BASE64: ${{ secrets.MC_ANDROID_KEYSTORE_BASE64 }}
          MC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MC_ANDROID_KEYSTORE_PASSWORD }}
          MC_ANDROID_KEY_ALIAS: ${{ secrets.MC_ANDROID_KEY_ALIAS }}
          MC_ANDROID_KEY_PASSWORD: ${{ secrets.MC_ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          names=['MC_ANDROID_KEYSTORE_BASE64','MC_ANDROID_KEYSTORE_PASSWORD','MC_ANDROID_KEY_ALIAS','MC_ANDROID_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Configure the four permanent MC_ANDROID_* Actions Secrets first. Refusing to generate or use a debug signing key.')
          path=Path(os.environ['RUNNER_TEMP'])/'michael-calculus-release.jks'
          path.write_bytes(base64.b64decode(os.environ['MC_ANDROID_KEYSTORE_BASE64'],validate=True))
          path.chmod(0o600)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source version and frontend
        run: |
          node -e 'if (require("./package.json").version !== process.env.RELEASE_TAG.slice(1)) process.exit(1)'
          npm ci
          npm run validate:bank
          npm run typecheck
          npm test
          npm run test:signing
          npm run lint
          npm run check:css
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run android:sync
      - name: Build signed release APK and run Android lint
        env:
          MC_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/michael-calculus-release.jks
          MC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MC_ANDROID_KEYSTORE_PASSWORD }}
          MC_ANDROID_KEY_ALIAS: ${{ secrets.MC_ANDROID_KEY_ALIAS }}
          MC_ANDROID_KEY_PASSWORD: ${{ secrets.MC_ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: bash gradlew assembleRelease lintRelease
      - name: Require the pinned certificate, package and version
        run: node scripts/verify-android-release.mjs android/app/build/outputs/apk/release/app-release.apk
      - name: Package verified artifacts
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "Michael-calculus-${VERSION}.apk"
          (cd dist && zip -qr "../Michael-calculus-${VERSION}-pwa.zip" .)
          git archive --format=zip --prefix="Michael-calculus/" -o "Michael-calculus-${VERSION}-source.zip" HEAD
          sha256sum "Michael-calculus-${VERSION}.apk" "Michael-calculus-${VERSION}-pwa.zip" "Michael-calculus-${VERSION}-source.zip" > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            App Hub 登录使用系统浏览器的自定义标签页，支持登录后返回应用。
            离线 PWA 网页版：支持添加到 iOS / Android / 桌面主屏幕并完整离线使用（亦可下载 `Michael-calculus-*-pwa.zip` 自建静态托管）。
            固定签名正式包：已核对仓库中锁定的唯一证书、包名和版本，后续正式版本使用同一签名覆盖更新。
            历史 v0.5/v0.6 随机调试签名与此证书不同，不能直接覆盖；请先保留旧版，按 docs/android-signing.md 只读备份并导入数据，不要在备份验证前卸载。
            本次不包含 Android 真机迁移验收；自动化检查通过不等于已经操作过用户手机。
          files: |
            Michael-calculus-*.apk
            Michael-calculus-*-pwa.zip
            Michael-calculus-*-source.zip
            SHA256SUMS.txt
      - name: Remove temporary private key
        if: always()
        run: rm -f "$RUNNER_TEMP/michael-calculus-release.jks"

  publish-bytevirt:
    if: ${{ vars.CALCULUS_AUTO_PUBLISH_LEGACY == 'true' }}
    needs: build-and-release
    permissions:
      contents: read
    uses: ./.github/workflows/bytevirt.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
    secrets:
      CALCULUS_UPDATE_MANIFEST_KEY: ${{ secrets.CALCULUS_UPDATE_MANIFEST_KEY }}
      CALCULUS_UPDATE_DEPLOY_KEY: ${{ secrets.CALCULUS_UPDATE_DEPLOY_KEY }}
