name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and verify frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run lint
          npm run android:sync

      - name: Build Android Debug APK and run Lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintRelease

      - name: Package release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "Michael-calculus-${VERSION}-debug.apk"
          git archive --format=zip --prefix="Michael-calculus/" -o "Michael-calculus-${VERSION}-source.zip" HEAD

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Michael-calculus-*-debug.apk
            Michael-calculus-*-source.zip
