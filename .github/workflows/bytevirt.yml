name: Publish Android update to ByteVirt

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      CALCULUS_UPDATE_MANIFEST_KEY:
        required: true
      CALCULUS_UPDATE_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub APK release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bytevirt-calculus-stable-android
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify the released APK
        working-directory: release-source
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          apk="$RUNNER_TEMP/Michael-calculus-$version.apk"
          curl --fail --silent --show-error --location --retry 4 \
            --output "$apk" "https://github.com/x-zyz/michael-calculus/releases/download/$RELEASE_TAG/Michael-calculus-$version.apk"
          node scripts/verify-android-release.mjs "$apk"
      - name: Publish to the stable Android channel
        working-directory: release-source
        shell: bash
        env:
          MANIFEST_KEY: ${{ secrets.CALCULUS_UPDATE_MANIFEST_KEY }}
          DEPLOY_KEY: ${{ secrets.CALCULUS_UPDATE_DEPLOY_KEY }}
        run: |
          test -n "$MANIFEST_KEY" && test -n "$DEPLOY_KEY"
          umask 077
          work="$(mktemp -d)"
          trap 'rm -f "$work/manifest.pem" "$work/deploy" "$work/release.bvu"; rmdir "$work"' EXIT
          printf '%s\n' "$MANIFEST_KEY" > "$work/manifest.pem"
          printf '%s\n' "$DEPLOY_KEY" > "$work/deploy"
          unset MANIFEST_KEY DEPLOY_KEY
          version="${RELEASE_TAG#v}"
          BYTEVIRT_CHECK_LIVE=1 node ../scripts/prepare-bytevirt-release.mjs \
            "$RUNNER_TEMP/Michael-calculus-$version.apk" "$version" \
            "$work/manifest.pem" "$work/release.bvu"
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 -o UserKnownHostsFile=../scripts/bytevirt-known-hosts \
            -i "$work/deploy" bytevirt-updates@141.11.138.234 publish-v1 < "$work/release.bvu"
