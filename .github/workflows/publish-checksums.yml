name: Build signed Android candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact reviewed Android candidate commit SHA
        type: string
        required: true

permissions:
  contents: read

jobs:
  candidate:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'x-zyz/michael-calculus' && github.ref == 'refs/heads/build/android-v1-rc'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ inputs.tag }}
      REVIEWED_SHA: 0d2ca983b1ffeb5a4ff2dceafe8e21b4aa4a8341
      APK_NAME: Michael-Calculus-1.0.0-rc-build43.apk
    steps:
      - name: Require the reviewed candidate
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$CANDIDATE_SHA" == "$REVIEWED_SHA" ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Confirm candidate identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          node -e 'if (require("./package.json").version !== "1.0.0") process.exit(1)'
          grep -Eq 'applicationId "com\.michael\.calculus"' android/app/build.gradle
          grep -Eq 'versionName "1\.0\.0"' android/app/build.gradle
          grep -Eq 'versionCode 43([[:space:]]|$)' android/app/build.gradle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - name: Validate and prepare Android project
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run check:css
          npm test
          npm run test:signing
          npm run android:sync
      - name: Sign candidate with the permanent key
        working-directory: android
        env:
          MC_ANDROID_KEYSTORE_BASE64: ${{ secrets.MC_ANDROID_KEYSTORE_BASE64 }}
          MC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MC_ANDROID_KEYSTORE_PASSWORD }}
          MC_ANDROID_KEY_ALIAS: ${{ secrets.MC_ANDROID_KEY_ALIAS }}
          MC_ANDROID_KEY_PASSWORD: ${{ secrets.MC_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export MC_ANDROID_KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/calculus-rc.XXXXXXXX")"
          trap 'rm -f -- "$MC_ANDROID_KEYSTORE_PATH"' EXIT
          python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["MC_ANDROID_KEYSTORE_PATH"]).write_bytes(base64.b64decode(os.environ["MC_ANDROID_KEYSTORE_BASE64"], validate=True))'
          unset MC_ANDROID_KEYSTORE_BASE64
          bash gradlew --no-daemon assembleRelease lintRelease
      - name: Verify signature and prepare downloads
        run: |
          set -euo pipefail
          mkdir candidate-download
          cp android/app/build/outputs/apk/release/app-release.apk "candidate-download/$APK_NAME"
          node scripts/verify-android-release.mjs "candidate-download/$APK_NAME" | tee candidate-download/verification.txt
          printf 'Candidate source commit: %s\n' "$REVIEWED_SHA" >> candidate-download/verification.txt
          cd candidate-download
          sha256sum "$APK_NAME" > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Michael-Calculus-1.0.0-rc-build43
          path: |
            candidate-download/Michael-Calculus-1.0.0-rc-build43.apk
            candidate-download/SHA256SUMS.txt
            candidate-download/verification.txt
          if-no-files-found: error
          retention-days: 3
