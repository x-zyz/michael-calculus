name: Publish Release Checksums

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify
        required: true
        type: string

permissions:
  contents: write

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Download existing artifacts and publish SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --pattern '*-pwa.zip' --pattern '*-source.zip' --dir release-checksums
          cd release-checksums
          sha256sum -- *.apk *.zip > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
