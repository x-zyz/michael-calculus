name: Deploy PWA to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pwa-github-pages
  cancel-in-progress: true

jobs:
  deploy-pwa:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build offline PWA bundle
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - name: Wait for the uploaded Pages artifact to become visible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          for attempt in {1..10}; do
            if timeout 10s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" |
              jq -e --arg id "$ARTIFACT_ID" --arg name "$ARTIFACT_NAME" \
                'any(.artifacts[]; (.id | tostring) == $id and .name == $name and .expired == false)' >/dev/null; then
              echo "Pages artifact $ARTIFACT_ID is visible on attempt $attempt."
              exit 0
            fi
            echo "Waiting for Pages artifact visibility (attempt $attempt/10)."
            if (( attempt < 10 )); then sleep 6; fi
          done
          echo "::error::Pages artifact $ARTIFACT_ID never became visible for this run."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
