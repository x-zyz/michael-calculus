name: Deploy PWA to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pwa-github-pages
  cancel-in-progress: true

jobs:
  deploy-pwa:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build offline PWA bundle
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - name: Require an uploaded artifact ID
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]'
      # Without a GitHub token, download-artifact uses the same runner artifact
      # service as deploy-pages. The REST listing can be visible earlier.
      - name: Check the uploaded artifact in the runner artifact service
        id: check-artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact_id }}
          path: ${{ runner.temp }}/pages-artifact
      - name: Wait for the runner artifact index
        if: steps.check-artifact.outcome == 'failure'
        run: sleep 12
      - name: Retry the artifact check
        id: retry-artifact
        if: steps.check-artifact.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact_id }}
          path: ${{ runner.temp }}/pages-artifact
      - name: Wait once more for the runner artifact index
        if: steps.retry-artifact.outcome == 'failure'
        run: sleep 18
      - name: Require the uploaded artifact before deployment
        if: steps.retry-artifact.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact_id }}
          path: ${{ runner.temp }}/pages-artifact
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
